name: validasi-konten

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validasi draft
        run: python tools/cek_konten.py drafts/
      - name: Pastikan tidak ada rahasia yang ikut ter-commit
        run: |
          if git ls-files | grep -E '(\.env|\.secret\.json|_token_|user_id)' ; then
            echo "Ditemukan berkas rahasia. Batalkan commit."
            exit 1
          fi
          echo "Tidak ada berkas rahasia."
